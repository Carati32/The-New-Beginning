<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Classe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Selecione sua classe</h1>
    <div class="buttons">
        <button data-classe="Mago" data-hp="20" data-cor="blue" data-ataque-especial="Calamidade do Vazio">Mago</button>
        <button data-classe="Guerreir" data-hp="40" data-cor="#e0e0e0" data-ataque-especial="Golpe Valente">Guerreiro</button>
        <button data-classe="Berserk" data-hp="30" data-cor="darkred" data-ataque-especial="Frenesi de Sangue">Berserk</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
