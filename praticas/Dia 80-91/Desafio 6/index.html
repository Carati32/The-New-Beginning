<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card que vira</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="frente">
                <img src="hu tao.jpeg" alt="Avatar da Hu tao">
                <h1>Hu tao Dev</h1>
                <p>Front-end Developer ✨</p>
                <button>Clique para ver o verso</button>

            </div>
            <div class="verso">
                <h1>Habilidades</h1>
                <div class="habs">
                    <p>HTML</p>
                    <div class="barra-html">
                        <div class="progresso-html"></div>
                    </div>
                    <p>CSS</p>
                    <div class="barra-css">
                        <div class="progresso-css"></div>
                    </div>
                    <p>JS</p>
                    <div class="barra-js">
                        <div class="progresso-js"></div>
                    </div>
                </div>
                <a href="#">github.com/carati32</a>
                <a href="#">linkedin.com/in/carati</a>
                <button>Clique para ver a frente</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
