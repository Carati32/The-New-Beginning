<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Minha lista de tarefas</h1>
        <div id="adicionar-tarefas">
            <label for="nova-tarefa" class="visually-hidden">Nova tarefa</label>
            <input type="text" placeholder="Digite uma tarefa..." id="nova-tarefa">
            <button id="adicionar">+</button>
        </div>
        <ul id="lista-tarefas">
        </ul>
        <div class="info">
            <p id="pendente"></p>
            <p id="concluida"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
